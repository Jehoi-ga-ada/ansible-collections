---
- name: Check active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false

- name: Create swap file
  ansible.builtin.command: "dd if=/dev/zero of={{ swap_file }} bs=1M count={{ swap_size_mb }}"
  args:
    creates: "{{ swap_file }}"
  register: swap_created

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command: "mkswap {{ swap_file }}"
  when: swap_created is changed

- name: Enable swap file
  ansible.builtin.command: "swapon {{ swap_file }}"
  when: swap_file not in swap_active.stdout_lines

- name: Enable swap file at boot
  ansible.posix.mount:
    src: "{{ swap_file }}"
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Set swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    sysctl_file: /etc/sysctl.d/99-swap.conf
    reload: true
