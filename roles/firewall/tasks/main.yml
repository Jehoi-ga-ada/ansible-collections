---
- name: Check SSH is reachable over Tailscale
  ansible.builtin.wait_for:
    host: "{{ tailscale_ipv4 }}"
    port: 22
    timeout: 10
  delegate_to: localhost
  become: false

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow Tailscale interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0

- name: Allow public ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }
    - { port: "41641", proto: udp }

- name: Allow public SSH
  community.general.ufw:
    rule: limit
    name: OpenSSH
  when: firewall_allow_public_ssh

- name: Enable ufw
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
