---
- name: Assert required Caddy vars are set
  ansible.builtin.assert:
    that:
      - caddy_acme_email | length > 0
      - caddy_cloudflare_token | length > 0

- name: Create Caddy directory
  ansible.builtin.file:
    path: "{{ caddy_dir }}"
    state: directory
    mode: "0750"

- name: Template Caddy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ caddy_dir }}/compose.yaml"
    mode: "0600"
  no_log: true

- name: Start Caddy stack
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir }}"
    state: present
